<title>Prototipe Sistem Peminjaman Barang</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#14305E; --navy-line:#dfe6f5; --active:#3487C8; --bg:#E8ECF5; --white:#FFFFFF;
  --ink:#14305E; --muted:#5d6b8c; --line:#d3dbea; --thead:#E3EBFA;
  --blue:#2F80ED; --green:#46B26B; --orange:#F2A62E; --purple:#A47AEE; --red:#D9534F;
  --card-blue:#3A86F4;
  color-scheme: light;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif;font-size:14px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.ic{display:inline-block;width:22px;height:22px;flex:none}.ic svg{width:100%;height:100%;display:block}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:24px;padding:32px 6vw}
.login .brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.login .brand h1{font-size:28px;font-weight:700;color:var(--navy)}
.login .brand p{font-size:15px;max-width:300px;color:#22314f}
.lcard{background:var(--white);border-radius:12px;padding:28px 30px;box-shadow:0 6px 18px #14305e30;max-width:440px;width:100%;justify-self:center}
.lcard h2{font-size:32px;font-weight:700;color:var(--navy);margin-bottom:6px}
.lcard .sub{font-size:14px;margin-bottom:22px;color:#33415c}
.field{display:flex;align-items:center;gap:10px;height:46px;border:2px solid #d9def0;border-radius:6px;padding:0 12px;background:#fff;margin-bottom:16px;box-shadow:0 3px 5px #14305e25;color:#6b7694}
.field input{border:0;outline:0;flex:1;font:inherit;font-size:14px;color:var(--ink);background:transparent;min-width:0}
.field .ic{width:16px;height:16px}
.field:focus-within{border-color:var(--blue)}
.btn{display:inline-block;border:0;border-radius:4px;background:var(--blue);color:#fff;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.btn.big{padding:12px 18px;font-size:15px;border-radius:6px;width:100%;box-shadow:0 3px 5px #14305e30}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.gr{background:#3BAA66}.btn.rd{background:var(--red)}.btn.or{background:var(--orange)}.btn.gray{background:#9aa4bd}
.btn.l{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn[disabled]{background:#c4c9d6;color:#fff;cursor:not-allowed}
.err{color:#C0392B;font-size:13px;margin:-6px 0 12px;min-height:18px}
.hint{font-size:12.5px;color:#4b5877;margin-top:12px;text-align:center}
.hint a,.lcard .link{color:var(--navy);font-weight:600}
.demo{max-width:440px;justify-self:center;font-size:12.5px;color:#33415c;margin-top:12px;background:#ffffffb0;border-radius:8px;padding:10px 14px}
/* app */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--navy);color:#fff;display:flex;flex-direction:column}
.sbrand{display:flex;align-items:center;gap:10px;padding:0 14px;height:56px;font-weight:600;font-size:13px;border-bottom:1.5px solid var(--navy-line)}
.menu{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:6px}
.mi{display:flex;align-items:center;gap:14px;padding:0 14px;height:48px;border-radius:8px;font-weight:600;font-size:14.5px;background:transparent;color:#fff;border:0;text-align:left;width:100%}
.mi.on{background:var(--active)}
.mi:hover{background:#ffffff1c}.mi.on:hover{background:var(--active)}
.lo{border-top:1.5px solid var(--navy-line);padding:0 18px;height:60px}
.lo .mi{height:60px;padding:0 6px}
.main{display:flex;flex-direction:column;min-width:0}
.head{height:56px;background:#fff;box-shadow:0 3px 5px #00000030;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 28px;font-weight:700;font-size:17px;position:relative;z-index:1}
.head .ic{width:26px;height:26px}.head .ch{width:18px;height:18px}
.page{padding:18px 28px 36px}
.page h1{font-size:19px;font-weight:700;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.card{border-radius:14px;color:#fff;padding:16px 18px;font-size:13px;font-weight:500;min-height:96px}
.card .ic{width:24px;height:24px;display:block;margin-bottom:8px}.card b{display:block;font-size:26px;font-weight:600;margin-top:2px}
.panel{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 1px 4px #00000020;margin-bottom:16px}
.panel h2{font-size:17px;font-weight:700;margin-bottom:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{background:var(--thead);border:1px solid #c3d0ea;padding:9px 8px;font-weight:600;white-space:nowrap}
td{border:1px solid var(--line);padding:9px 8px;text-align:center;white-space:nowrap}
td.l{text-align:left}
td.wrap{white-space:normal;min-width:160px;text-align:left}
.pill{display:inline-block;padding:3px 12px;border-radius:12px;font-size:12px;font-weight:600}
.p-g{background:#B8F2B0;color:#2f8a2f}.p-y{background:#FFE8A8;color:#c78c00}.p-b{background:#BFE3FF;color:#2F80ED}.p-s{background:#D3D3D3;color:#444}.p-r{background:#FFD0CC;color:#C0392B}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.inp,.sel{height:38px;border:1.5px solid #cdd6ea;border-radius:6px;background:#fff;padding:0 12px;font:inherit;font-size:13.5px;color:var(--ink);box-shadow:0 1px 3px #0001;min-width:0}
.bar .grow{flex:1}
.flash{border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;font-weight:500}
.flash.ok{background:#DDF5E3;color:#1f6b3a;border:1px solid #9fd9b2}.flash.err{background:#FDE3E1;color:#9f2d24;border:1px solid #f1a9a3}
.acts{display:flex;gap:6px;justify-content:center}
.foot{font-size:12px;color:var(--muted);margin-top:8px}
/* form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.form .full{grid-column:1/-1}
.form label,.mbody label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.form .inp,.form .sel,.mbody .inp,.mbody .sel{width:100%}
textarea.inp{height:84px;padding:10px 12px;resize:vertical}
.fe{color:#C0392B;font-size:12.5px;margin-top:4px}
/* modal */
.ov{position:fixed;inset:0;background:#0a1a3a80;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:#fff;border-radius:12px;max-width:480px;width:100%;box-shadow:0 12px 40px #0006;max-height:92vh;overflow:auto}
.mh{padding:16px 20px;font-weight:700;font-size:17px;border-bottom:1px solid var(--line)}
.mbody{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.mf{padding:12px 20px 18px;display:flex;gap:10px;justify-content:flex-end}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;font-size:13.5px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
@media (max-width:900px){
  .login{grid-template-columns:1fr}
  .app{grid-template-columns:1fr}
  .side{flex-direction:row;flex-wrap:wrap;align-items:center}
  .sbrand{border-bottom:0;width:100%}
  .menu{flex-direction:row;overflow-x:auto;padding:4px 8px 8px;flex:1 1 100%}
  .mi{width:auto;white-space:nowrap;height:42px}
  .lo{border-top:0;height:auto;padding:0 8px 8px}.lo .mi{height:42px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:1fr}
  .page{padding:14px 16px 28px}.head{padding:0 16px}
}
</style>

    <div><label for="mTotal">Jumlah Total</label><input class="inp" id="mTotal" inputmode="numeric" value="${esc(v.total)}">${m.errors&&m.errors.total?`<div class="fe">${esc(m.errors.total)}</div>`:''}</div>
    <div><label for="mKondisi">Kondisi</label><select class="sel" id="mKondisi">${['Baik','Rusak ringan','Rusak berat'].map(k=>`<option ${v.kondisi===k?'selected':''}>${k}</option>`).join('')}</select></div>
    ${b?`<div><label for="mStatus">Status</label><select class="sel" id="mStatus">${['Tersedia','Tidak Tersedia'].map(k=>`<option ${v.status===k?'selected':''}>${k}</option>`).join('')}</select></div>`:''}`;
    foot=`<button class="btn l" data-close>Batal</button><button class="btn" id="mSimpan">Simpan</button>`;
  }else if(m.kind==='hapus'){
    t='Hapus Barang';body=`<p>Hapus barang <b>${esc(B(m.id).nama_barang)}</b>? Tindakan ini tidak dapat dibatalkan.</p>`;
    foot=`<button class="btn l" data-close>Batal</button><button class="btn rd" id="mHapus">Hapus</button>`;
  }else if(m.kind==='tolak'){
    t='Tolak Pengajuan';body=`<p>Pengajuan ${esc(U(P(m.id).id_user).nama)} untuk ${esc(B(P(m.id).id_barang).nama_barang)}.</p><div><label for="mAlasan">Alasan penolakan</label><textarea class="inp" id="mAlasan" placeholder="Tuliskan alasan penolakan"></textarea>${m.error?`<div class="fe" id="mError">${esc(m.error)}</div>`:''}</div>`;
    foot=`<button class="btn l" data-close>Batal</button><button class="btn rd" id="mTolak">Tolak Pengajuan</button>`;
  }else if(m.kind==='kembali'){
    const p=P(m.id);t='Catat Pengembalian';
    body=`<p>${esc(U(p.id_user).nama)} mengembalikan <b>${p.jumlah_pinjam} ${esc(B(p.id_barang).nama_barang)}</b>.</p><div><label>Tanggal dikembalikan</label><input class="inp" value="${fmt(TODAY)}" readonly></div><div><label for="mKondisiKembali">Kondisi barang</label><select class="sel" id="mKondisiKembali"><option>Baik</option><option>Rusak ringan</option><option>Rusak berat</option></select></div>`;
    foot=`<button class="btn l" data-close>Batal</button><button class="btn gr" id="mKembali">Simpan Pengembalian</button>`;
  }else if(m.kind==='detail'){
    const p=P(m.id);t='Detail Peminjaman';
    body=`<dl class="kv"><dt>Peminjam</dt><dd>${esc(U(p.id_user).nama)} (${esc(U(p.id_user).nim_nip)})</dd><dt>Barang</dt><dd>${esc(B(p.id_barang).nama_barang)}, ${p.jumlah_pinjam} unit</dd><dt>Keperluan</dt><dd>${esc(p.keperluan)}</dd><dt>Tanggal pengajuan</dt><dd>${fmt(p.tanggal_pengajuan)}</dd><dt>Tanggal pinjam</dt><dd>${fmt(p.tanggal_pinjam)}</dd><dt>Kembali (rencana)</dt><dd>${fmt(p.tanggal_kembali_rencana)}</dd><dt>Dikembalikan</dt><dd>${fmt(p.tanggal_dikembalikan)}</dd><dt>Status</dt><dd>${pill(p.status)}</dd><dt>Diverifikasi oleh</dt><dd>${p.id_admin?esc(U(p.id_admin).nama)+' ('+fmt(p.tanggal_verifikasi)+')':'-'}</dd><dt>Alasan penolakan</dt><dd>${esc(p.alasan_penolakan||'-')}</dd><dt>Kondisi saat kembali</dt><dd>${esc(p.kondisi_kembali||'-')}</dd></dl>`;
    foot=`<button class="btn" data-close>Tutup</button>`;
  }
  return `<div class="ov" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(t)}"><div class="mh">${esc(t)}</div><div class="mbody">${body}</div><div class="mf">${foot}</div></div></div>`;
}
const P=id=>S.pinjam.find(p=>p.id===id);
/* ---------- render + events ---------- */
function render(){
  const r=root();
  if(!S.session){r.innerHTML=loginView(S.loginError,S.loginUser);bindLogin();return}
  const pages={dashboard,databarang:dataBarang,peminjaman,pengembalian,laporan,daftar,pengajuan:()=>pengajuan(S.formValues,S.formErrors),riwayat};
  r.innerHTML=shell(pages[S.page]());
  bindApp();
}
function bindLogin(){
  document.getElementById('loginForm').addEventListener('submit',e=>{
    e.preventDefault();
    const un=document.getElementById('username').value.trim(),pw=document.getElementById('password').value;
    S.loginUser=un;
    if(!un||!pw){S.loginError='Username dan password wajib diisi.';render();return}
    const u=S.users.find(x=>x.username.toLowerCase()===un.toLowerCase()&&x.password===pw);
    if(!u){S.loginError='Username atau password salah.';render();return}
    S.loginError='';S.loginUser='';S.session=u;S.page=u.role==='Admin'?'dashboard':'daftar';S.flash=null;render();
  });
}
function bindApp(){
  const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
  $$('[data-nav]').forEach(b=>b.onclick=()=>{S.formValues=null;S.formErrors=null;go(b.dataset.nav)});
  $('#btnLogout').onclick=()=>{S.session=null;S.page=null;S.flash=null;S.modal=null;S.loginError='';render()};
  const search=$('#search');if(search)search.oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const s=$('#search');s.focus();s.setSelectionRange(pos,pos)};
  const sf=$('#statusFilter');if(sf)sf.onchange=e=>{S.statusFilter=e.target.value;render()};
  $$('[data-detail]').forEach(b=>b.onclick=()=>{S.modal={kind:'detail',id:+b.dataset.detail};render()});
  $$('[data-close]').forEach(b=>b.onclick=()=>{S.modal=null;render()});
  /* admin: barang */
  const tb=$('#btnTambah');if(tb)tb.onclick=()=>{S.modal={kind:'barang',id:null};render()};
  $$('[data-ubah]').forEach(b=>b.onclick=()=>{S.modal={kind:'barang',id:+b.dataset.ubah};render()});
  $$('[data-hapus]').forEach(b=>b.onclick=()=>{
    const id=+b.dataset.hapus;
    if(S.pinjam.some(p=>p.id_barang===id)){flash('err','Barang tidak dapat dihapus karena sudah memiliki riwayat peminjaman. Ubah status menjadi Tidak Tersedia.');render();return}
    S.modal={kind:'hapus',id};render();
  });
  const ms=$('#mSimpan');if(ms)ms.onclick=saveBarang;
  const mh=$('#mHapus');if(mh)mh.onclick=()=>{const id=S.modal.id,nm=B(id).nama_barang;S.barang=S.barang.filter(b=>b.id!==id);S.modal=null;flash('ok',`Barang ${nm} berhasil dihapus.`);render()};
  /* admin: peminjaman */
  $$('[data-setujui]').forEach(b=>b.onclick=()=>setujui(+b.dataset.setujui));
  $$('[data-tolak]').forEach(b=>b.onclick=()=>{S.modal={kind:'tolak',id:+b.dataset.tolak};render()});
  const mt=$('#mTolak');if(mt)mt.onclick=()=>{
    const al=$('#mAlasan').value.trim();
    if(!al){S.modal.error='Alasan penolakan wajib diisi.';render();return}
    const p=P(S.modal.id);p.status='Ditolak';p.alasan_penolakan=al;p.id_admin=S.session.id;p.tanggal_verifikasi=TODAY;
    S.modal=null;flash('ok','Pengajuan ditolak. Alasan penolakan tersimpan.');render();
  };
  $$('[data-serahkan]').forEach(b=>b.onclick=()=>{const p=P(+b.dataset.serahkan);p.status='Dipinjam';flash('ok','Barang diserahkan. Status menjadi Dipinjam.');render()});
  $$('[data-kembali]').forEach(b=>b.onclick=()=>{S.modal={kind:'kembali',id:+b.dataset.kembali};render()});
  const mk=$('#mKembali');if(mk)mk.onclick=()=>{
    const p=P(S.modal.id),b=B(p.id_barang);
    p.status='Dikembalikan';p.tanggal_dikembalikan=TODAY;p.kondisi_kembali=$('#mKondisiKembali').value;
    b.stok_tersedia+=p.jumlah_pinjam;setAuto(b);
    S.modal=null;flash('ok','Pengembalian dicatat. Stok barang bertambah.');render();
  };
  /* laporan */
  const bt=$('#btnTampilkan');if(bt)bt.onclick=()=>{S.lap={dari:$('#lapDari').value,sampai:$('#lapSampai').value,status:$('#lapStatus').value};flash('ok','Laporan diperbarui sesuai filter.');render()};
  const bc=$('#btnCetak');if(bc)bc.onclick=()=>{flash('ok','Simulasi: laporan siap dicetak.');render()};
  /* mahasiswa */
  $$('[data-ajukan]').forEach(b=>b.onclick=()=>{S.preselect=b.dataset.ajukan;S.formValues=null;S.formErrors=null;go('pengajuan')});
  const fa=$('#formAjukan');if(fa)fa.addEventListener('submit',submitAjukan);
  const ba=$('#btnBatalAju');if(ba)ba.onclick=()=>{S.formValues=null;S.formErrors=null;S.preselect=null;go('daftar')};
  const fb=$('#fBarang');if(fb)fb.onchange=()=>{S.preselect=fb.value};
}
function saveBarang(){
  const m=S.modal,$=s=>document.querySelector(s);
  const v={nama:$('#mNama').value.trim(),total:$('#mTotal').value.trim(),kondisi:$('#mKondisi').value,status:$('#mStatus')?$('#mStatus').value:'Tersedia'};
  const errors={};
  if(!v.nama)errors.nama='Nama barang wajib diisi.';
  const n=Number(v.total);
  if(!v.total)errors.total='Jumlah total wajib diisi.';
  else if(!Number.isInteger(n)||n<1)errors.total='Jumlah total harus bilangan bulat minimal 1.';
  else if(m.id&&n<out(B(m.id)))errors.total=`Jumlah total tidak boleh kurang dari barang yang sedang keluar (${out(B(m.id))}).`;
  if(Object.keys(errors).length){S.modal={...m,values:v,errors};render();return}
  if(m.id){
    const b=B(m.id),o=out(b);b.nama_barang=v.nama;b.jumlah_total=n;b.stok_tersedia=n-o;b.kondisi=v.kondisi;
    if(v.status!==b.status){b.status=v.status;b.auto=false}
    flash('ok',`Data barang ${v.nama} berhasil diperbarui.`);
  }else{
    S.barang.push({id:Math.max(0,...S.barang.map(b=>b.id))+1,nama_barang:v.nama,jumlah_total:n,stok_tersedia:n,kondisi:v.kondisi,status:'Tersedia',auto:false});
    flash('ok',`Barang ${v.nama} berhasil ditambahkan.`);
  }
  S.modal=null;render();
}
function setujui(id){
  const p=P(id),b=B(p.id_barang);
  if(b.stok_tersedia<p.jumlah_pinjam){flash('err',`Stok ${b.nama_barang} tidak mencukupi (tersedia ${b.stok_tersedia}, diminta ${p.jumlah_pinjam}). Tolak pengajuan atau tunggu pengembalian barang.`);render();return}
  p.status='Disetujui';p.id_admin=S.session.id;p.tanggal_verifikasi=TODAY;b.stok_tersedia-=p.jumlah_pinjam;setAuto(b);
  flash('ok','Pengajuan disetujui. Stok barang berkurang.');render();
}
function submitAjukan(e){
  e.preventDefault();
  const $=s=>document.querySelector(s);
  const v={barang:$('#fBarang').value,jumlah:$('#fJumlah').value.trim(),pinjam:$('#fPinjam').value,kembali:$('#fKembali').value,keperluan:$('#fKeperluan').value.trim()};
  const errs=[];const b=v.barang?B(+v.barang):null,n=Number(v.jumlah);
  if(!b)errs.push('Barang wajib dipilih.');
  if(!v.jumlah||!Number.isInteger(n)||n<1)errs.push('Jumlah harus bilangan bulat minimal 1.');
  if(b&&(b.status!=='Tersedia'||b.stok_tersedia<1))errs.push(`${b.nama_barang} tidak tersedia untuk dipinjam.`);
  else if(b&&Number.isInteger(n)&&n>b.stok_tersedia)errs.push(`Jumlah melebihi stok tersedia (${b.stok_tersedia}).`);
  if(!v.pinjam)errs.push('Tanggal pinjam wajib diisi.');else if(v.pinjam<TODAY)errs.push('Tanggal pinjam tidak boleh sebelum tanggal hari ini.');
  if(!v.kembali)errs.push('Tanggal kembali wajib diisi.');else if(v.pinjam&&v.kembali<v.pinjam)errs.push('Tanggal kembali tidak boleh sebelum tanggal pinjam.');
  if(!v.keperluan)errs.push('Keperluan wajib diisi.');
  if(errs.length){S.formValues=v;S.formErrors=errs;S.flash=null;render();return}
  S.pinjam.push({id:Math.max(...S.pinjam.map(p=>p.id))+1,id_user:S.session.id,id_barang:b.id,id_admin:null,jumlah_pinjam:n,keperluan:v.keperluan,tanggal_pengajuan:TODAY,tanggal_pinjam:v.pinjam,tanggal_kembali_rencana:v.kembali,tanggal_dikembalikan:null,tanggal_verifikasi:null,status:'Menunggu',alasan_penolakan:null,kondisi_kembali:null});
  S.formValues=null;S.formErrors=null;S.preselect=null;S.page='riwayat';flash('ok','Pengajuan terkirim dengan status Menunggu.');render();
}
seed();render();
window.__proto={get state(){return S},reset(){seed();render()}};
</script>

</body></html>
